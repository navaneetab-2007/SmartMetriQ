{% extends 'base.html' %}

{% block title %}SmartMetriQ | Login{% endblock %}

{% block content %}
<section class="login-wrapper">
  <div class="login-card">
    <span class="demo-badge">Demo Authentication</span>
    <h2 class="mb-3">Login</h2>
    <p class="text-muted">Use the demo credentials provided for the prototype.</p>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username" placeholder="admin" required />
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="admin123" required />
      </div>

      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>
    </form>

    <div class="mt-4 small text-muted">
      Demo credentials:<br />
      Username: <strong>admin</strong><br />
      Password: <strong>admin123</strong>
    </div>
  </div>
</section>
{% endblock %}
