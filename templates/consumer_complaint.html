{% extends 'base.html' %}

{% block title %}SmartMetriQ | File Complaint{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <p class="eyebrow mb-1">Consumer Mode</p>
          <h2 class="mb-3">File a Complaint</h2>

          {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
          {% endif %}

          <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
              <label for="product_name" class="form-label">Product Name</label>
              <input type="text" class="form-control" id="product_name" name="product_name" placeholder="Optional: detected product name" />
            </div>

            <div class="mb-3">
              <label for="complaint_description" class="form-label">Complaint Description</label>
              <textarea class="form-control" id="complaint_description" name="complaint_description" rows="5" required></textarea>
            </div>

            <div class="mb-3">
              <label for="language" class="form-label">Language</label>
              <select class="form-select" id="language" name="language">
                <option value="eng">English</option>
                <option value="hin">Hindi</option>
                <option value="kan">Kannada</option>
                <option value="eng+hin">English + Hindi</option>
                <option value="eng+kan">English + Kannada</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="image" class="form-label">Upload Product Image</label>
              <input type="file" class="form-control" id="image" name="image" accept=".jpg,.jpeg,.png,image/jpeg,image/png" />
            </div>

            <div class="d-flex gap-2 flex-wrap">
              <button type="submit" class="btn btn-primary">Submit Complaint</button>
              <a href="{{ url_for('consumer_dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
