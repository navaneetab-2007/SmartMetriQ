{% extends 'base.html' %}

{% block title %}SmartMetriQ | E-Commerce Checker{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <p class="eyebrow mb-1">🛒 E-Commerce Checker</p>
          <h2 class="mb-3">Online Listing Analysis</h2>

          {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
          {% endif %}

          <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label">Choose Input</label>
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="border rounded p-3 h-100">
                    <label for="listing_image" class="form-label mb-2">📸 Screenshot Upload</label>
                    <input type="file" class="form-control" id="listing_image" name="listing_image" accept=".jpg,.jpeg,.png,image/jpeg,image/png" />
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="border rounded p-3 h-100">
                    <label for="listing_text" class="form-label mb-2">📝 Paste Listing Text</label>
                    <textarea class="form-control" id="listing_text" name="listing_text" rows="6" placeholder="Paste the product listing text here..."></textarea>
                  </div>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="listing_url" class="form-label">Optional Listing URL</label>
              <input type="url" class="form-control" id="listing_url" name="listing_url" placeholder="https://example.com/product" />
            </div>

            <div class="mb-3">
              <label for="language" class="form-label">OCR Language</label>
              <select class="form-select" id="language" name="language">
                <option value="eng">English</option>
                <option value="hin">Hindi</option>
                <option value="kan">Kannada</option>
                <option value="eng+hin">English + Hindi</option>
                <option value="eng+kan">English + Kannada</option>
                <option value="eng+hin+kan">English + Hindi + Kannada</option>
              </select>
            </div>

            <div class="d-flex gap-2 flex-wrap">
              <button type="submit" class="btn btn-primary">Analyze Listing</button>
              <a href="{{ url_for('consumer_dashboard') if mode == 'consumer' else url_for('dashboard') }}" class="btn btn-outline-secondary">Back</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
